name: Backend tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-package-lock --ignore-scripts
      - run: node --test tests/*.test.js
      - run: node --check services/shipbubble.js
      - run: node --check routes/shipping.js
