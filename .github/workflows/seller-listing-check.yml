name: Seller listing backend checks
on:
  pull_request:
  push:
    branches: [feature/seller-safe-product-removal-and-studio-20261022]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: |
          for file in server.js routes/*.js; do node --check "$file"; done
